<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Capa de O Véu de Vaelbrook">
  <defs>
    <pattern id="hachureLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#241a10" stroke-width="1"/>
    </pattern>
    <pattern id="hachureMid" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4.5" height="4.5" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#241a10" stroke-width="1.1"/>
    </pattern>
    <pattern id="hachureRipple" width="10" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="10" y2="3" stroke="#241a10" stroke-width="1"/>
    </pattern>
    <clipPath id="frameClip">
      <rect x="78" y="358" width="644" height="640" />
    </clipPath>
  </defs>

  <!-- papel -->
  <rect x="0" y="0" width="800" height="1200" fill="#f1e6c9"/>
  <rect x="0" y="0" width="800" height="1200" fill="#000000" opacity="0.02"/>

  <!-- moldura externa -->
  <rect x="26" y="26" width="748" height="1148" fill="none" stroke="#241a10" stroke-width="4"/>
  <rect x="38" y="38" width="724" height="1124" fill="none" stroke="#241a10" stroke-width="1.5"/>

  <!-- florões de canto -->
  <g stroke="#241a10" stroke-width="2" fill="none">
    <path d="M40,90 C40,55 55,40 90,40" />
    <path d="M55,95 C55,70 70,55 95,55" />
    <circle cx="90" cy="40" r="3" fill="#241a10"/>
    <g transform="translate(800,0) scale(-1,1)">
      <path d="M40,90 C40,55 55,40 90,40" />
      <path d="M55,95 C55,70 70,55 95,55" />
      <circle cx="90" cy="40" r="3" fill="#241a10"/>
    </g>
    <g transform="translate(0,1200) scale(1,-1)">
      <path d="M40,90 C40,55 55,40 90,40" />
      <path d="M55,95 C55,70 70,55 95,55" />
      <circle cx="90" cy="40" r="3" fill="#241a10"/>
    </g>
    <g transform="translate(800,1200) scale(-1,-1)">
      <path d="M40,90 C40,55 55,40 90,40" />
      <path d="M55,95 C55,70 70,55 95,55" />
      <circle cx="90" cy="40" r="3" fill="#241a10"/>
    </g>
  </g>

  <!-- título -->
  <text x="400" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="8" fill="#241a10">LIVRO-JOGO</text>
  <line x1="260" y1="118" x2="540" y2="118" stroke="#241a10" stroke-width="1.5"/>
  <circle cx="400" cy="118" r="4" fill="#241a10"/>

  <text x="400" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="64" letter-spacing="4" fill="#241a10">O VÉU DE</text>
  <text x="400" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="70" letter-spacing="3" fill="#241a10">VAELBROOK</text>

  <text x="400" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#241a10">Uma aventura de fantasia sombria e mistério</text>

  <!-- emblema: olho fechado dentro de um círculo quebrado -->
  <g transform="translate(400,326)" stroke="#241a10" fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M 0,-22 A 22,22 0 1 1 -15.6,-15.6" />
    <path d="M -14,0 Q 0,7 14,0" />
  </g>

  <!-- painel principal da ilustração -->
  <rect x="78" y="358" width="644" height="640" fill="#eee0bd" stroke="#241a10" stroke-width="3"/>

  <g clip-path="url(#frameClip)">
    <!-- céu com nuvens em hachura -->
    <rect x="78" y="358" width="644" height="640" fill="#eee0bd"/>
    <g opacity="0.85">
      <path d="M78,470 Q160,440 250,468 T430,462 T620,478 T722,458 L722,358 L78,358 Z" fill="url(#hachureLight)"/>
      <path d="M78,520 Q180,495 300,516 T560,508 T722,522 L722,470 Q600,478 430,468 T250,468 Q160,440 78,470 Z" fill="url(#hachureMid)" opacity="0.55"/>
    </g>

    <!-- lua -->
    <circle cx="245" cy="452" r="44" fill="#f1e6c9" stroke="#241a10" stroke-width="2.5"/>
    <circle cx="228" cy="436" r="6" fill="none" stroke="#241a10" stroke-width="1.3" opacity="0.6"/>
    <circle cx="256" cy="464" r="9" fill="none" stroke="#241a10" stroke-width="1.3" opacity="0.6"/>
    <circle cx="262" cy="432" r="4" fill="none" stroke="#241a10" stroke-width="1.2" opacity="0.5"/>

    <!-- colinas cinzentas distantes, com boca de caverna -->
    <path d="M78,660 L140,600 L200,650 L260,590 L330,655 L400,610 L470,662 L540,600 L610,650 L680,615 L722,655 L722,720 L78,720 Z" fill="#241a10"/>
    <ellipse cx="470" cy="655" rx="26" ry="34" fill="#0f0a06"/>

    <!-- névoa entre colinas e vilarejo -->
    <rect x="78" y="700" width="644" height="46" fill="url(#hachureLight)" opacity="0.6"/>

    <!-- vilarejo de Vaelbrook -->
    <g fill="#241a10">
      <path d="M150,780 L150,820 L200,820 L200,780 L175,752 Z"/>
      <path d="M205,790 L205,822 L250,822 L250,790 L227,764 Z"/>
      <path d="M260,775 L260,822 L305,822 L305,775 L282,748 Z"/>
      <path d="M330,795 L330,822 L370,822 L370,795 L350,772 Z"/>
      <path d="M560,790 L560,822 L604,822 L604,790 L582,764 Z"/>
      <path d="M610,780 L610,822 L655,822 L655,780 L632,752 Z"/>
      <!-- capela com torre -->
      <path d="M440,700 L440,822 L470,822 L470,700 L455,680 Z"/>
      <rect x="450" y="668" width="10" height="18"/>
      <line x1="455" y1="655" x2="455" y2="668" stroke="#241a10" stroke-width="3"/>
      <line x1="449" y1="661" x2="461" y2="661" stroke="#241a10" stroke-width="3"/>
    </g>
    <!-- janelas acesas -->
    <g fill="#eee0bd">
      <rect x="170" y="795" width="7" height="9"/>
      <rect x="222" y="800" width="7" height="9"/>
      <rect x="280" y="792" width="7" height="9"/>
      <rect x="580" y="800" width="7" height="9"/>
      <rect x="628" y="795" width="7" height="9"/>
      <rect x="452" y="730" width="7" height="10"/>
    </g>

    <!-- rio serpenteando até o primeiro plano -->
    <path d="M400,822 C380,860 430,890 400,930 C370,965 420,990 390,1030 L470,1030 C450,990 410,965 440,930 C470,895 420,860 450,822 Z" fill="url(#hachureRipple)" opacity="0.5" stroke="#241a10" stroke-width="1.5"/>

    <!-- penhasco em primeiro plano -->
    <path d="M78,998 L78,860 L160,880 L200,845 L260,890 L330,850 L410,900 L500,855 L590,895 L660,845 L722,880 L722,998 Z" fill="#241a10"/>

    <!-- viajante encapuzado, de costas, observando o vale -->
    <g transform="translate(400,895)">
      <!-- cajado -->
      <line x1="64" y1="-140" x2="50" y2="118" stroke="#241a10" stroke-width="6" stroke-linecap="round"/>
      <circle cx="65" cy="-146" r="7" fill="none" stroke="#241a10" stroke-width="4"/>
      <!-- capa e capuz, silhueta única -->
      <path d="M0,-115
               C-17,-115 -29,-101 -29,-85
               C-29,-75 -33,-68 -38,-60
               C-50,-42 -54,-16 -46,10
               C-58,24 -64,44 -60,66
               C-56,88 -52,104 -50,116
               L50,116
               C52,104 56,88 60,66
               C64,44 58,24 46,10
               C54,-16 50,-42 38,-60
               C33,-68 29,-75 29,-85
               C29,-101 17,-115 0,-115 Z" fill="#241a10"/>
      <!-- dobras da capa -->
      <path d="M-14,-40 C-20,0 -22,40 -24,90" fill="none" stroke="#eee0bd" stroke-width="2" opacity="0.55"/>
      <path d="M16,-40 C22,0 26,44 30,96" fill="none" stroke="#eee0bd" stroke-width="2" opacity="0.55"/>
      <path d="M0,-60 C-2,-10 -2,40 0,100" fill="none" stroke="#eee0bd" stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>

  <rect x="78" y="358" width="644" height="640" fill="none" stroke="#241a10" stroke-width="3"/>

  <!-- rodapé com ícones -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="1.5" fill="#241a10" text-anchor="middle">
    <g transform="translate(160,1050)">
      <circle r="30" fill="none" stroke="#241a10" stroke-width="2"/>
      <path d="M-11,11 L11,-11 M4,-14 L14,-4 M-14,4 L-4,14 M-11,11 L-6,11 L-11,6 Z" stroke="#241a10" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="50">ESCOLHAS</text>
    </g>
    <g transform="translate(292,1050)">
      <circle r="30" fill="none" stroke="#241a10" stroke-width="2"/>
      <rect x="-14" y="-14" width="28" height="28" rx="5" fill="none" stroke="#241a10" stroke-width="2.2"/>
      <circle cx="-6" cy="-6" r="2.2" fill="#241a10"/>
      <circle cx="6" cy="6" r="2.2" fill="#241a10"/>
      <circle cx="0" cy="0" r="2.2" fill="#241a10"/>
      <text y="50">TESTES</text>
    </g>
    <g transform="translate(400,1050)">
      <circle r="30" fill="none" stroke="#241a10" stroke-width="2"/>
      <path d="M0,-15 C10,-12 14,-10 14,-2 C14,10 6,16 0,19 C-6,16 -14,10 -14,-2 C-14,-10 -10,-12 0,-15 Z" fill="none" stroke="#241a10" stroke-width="2.2"/>
      <text y="50">COMBATES</text>
    </g>
    <g transform="translate(508,1050)">
      <circle r="30" fill="none" stroke="#241a10" stroke-width="2"/>
      <path d="M-6,-15 L6,-15 L6,-6 C12,-2 12,10 6,14 C2,17 -2,17 -6,14 C-12,10 -12,-2 -6,-6 Z" fill="none" stroke="#241a10" stroke-width="2.2"/>
      <line x1="-6" y1="-15" x2="-6" y2="-9" stroke="#241a10" stroke-width="2.2"/>
      <text y="50">ITENS</text>
    </g>
    <g transform="translate(640,1050)">
      <circle r="30" fill="none" stroke="#241a10" stroke-width="2"/>
      <path d="M-13,-13 A18,18 0 0 1 13,-13 A18,18 0 0 1 -13,13 A18,18 0 0 1 -13,-13 Z" fill="none" stroke="#241a10" stroke-width="0"/>
      <path d="M -14,0 A 14,14 0 1 1 10,12" fill="none" stroke="#241a10" stroke-width="2.2"/>
      <path d="M 11,13 L 17,6 M 11,13 L 19,15" stroke="#241a10" stroke-width="2.2" stroke-linecap="round"/>
      <text y="50">SEGREDOS</text>
    </g>
  </g>

  <text x="400" y="1170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="3" fill="#241a10">ATO I — DISPONÍVEL</text>
</svg>
