<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A lançadeira se afasta enquanto a Corvo-9 é destruída ao longe">
  <defs>
    <pattern id="hach4" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#241a10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="#f1e6c9"/>

  <!-- estrelas -->
  <g fill="#241a10">
    <circle cx="120" cy="90" r="1.6"/>
    <circle cx="220" cy="60" r="1.4"/>
    <circle cx="90" cy="200" r="1.6"/>
    <circle cx="700" cy="440" r="1.4"/>
    <circle cx="740" cy="380" r="1.6"/>
    <circle cx="60" cy="330" r="1.4"/>
  </g>

  <!-- explosão silenciosa ao longe -->
  <g transform="translate(560,190)">
    <circle r="70" fill="url(#hach4)" opacity="0.5"/>
    <circle r="34" fill="#f6ecd2" stroke="#241a10" stroke-width="3"/>
    <g stroke="#241a10" stroke-width="2.5">
      <line x1="0" y1="-90" x2="0" y2="-60"/>
      <line x1="0" y1="60" x2="0" y2="90"/>
      <line x1="-90" y1="0" x2="-60" y2="0"/>
      <line x1="60" y1="0" x2="90" y2="0"/>
      <line x1="-64" y1="-64" x2="-44" y2="-44"/>
      <line x1="44" y1="44" x2="64" y2="64"/>
      <line x1="-64" y1="64" x2="-44" y2="44"/>
      <line x1="44" y1="-44" x2="64" y2="-64"/>
    </g>
  </g>

  <!-- lançadeira, primeiro plano -->
  <g transform="translate(210,400) rotate(-18)">
    <path d="M-90,0 C-70,-22 -20,-30 40,-24 C70,-21 90,-10 96,0 C90,10 70,21 40,24 C-20,30 -70,22 -90,0 Z"
          fill="#241a10"/>
    <path d="M-30,-24 L-10,-46 L20,-44 L10,-22 Z" fill="#241a10"/>
    <path d="M-30,24 L-10,46 L20,44 L10,22 Z" fill="#241a10"/>
    <ellipse cx="30" cy="0" rx="14" ry="9" fill="#f1e6c9" stroke="#241a10" stroke-width="2.5"/>
    <path d="M-96,-6 L-120,0 L-96,6 Z" fill="#241a10" opacity="0.7"/>
  </g>

  <!-- rastro do motor -->
  <path d="M60,412 C20,420 -30,430 -80,445" stroke="#241a10" stroke-width="3" fill="none" opacity="0.55"/>
</svg>
