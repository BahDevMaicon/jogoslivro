    <circle cx="90" cy="95" r="9"/>
    <circle cx="330" cy="90" r="9"/>
    <circle cx="365" cy="275" r="9"/>
    <circle cx="225" cy="380" r="9"/>
    <circle cx="160" cy="385" r="9"/>
