  <!-- rosto/vazio com brilho -->
  <ellipse cx="208" cy="160" rx="42" ry="48" fill="#0c0906" stroke="#e8e2d5" stroke-width="3.5"/>
  <circle cx="192" cy="155" r="7" fill="#e0a94a"/>
  <circle cx="222" cy="152" r="6" fill="#e0a94a"/>
  <circle cx="205" cy="178" r="4" fill="#e0473a"/>
