<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="O Hospedeiro">
  <rect width="400" height="400" fill="#120d0a"/>
  <rect width="400" height="400" fill="none" stroke="#e8e2d5" stroke-width="2" opacity="0.3"/>

  <!-- tentáculos/membros alongados, alcançando as bordas -->
