    <path d="M190,230 C140,250 90,240 40,270"/>
    <path d="M195,220 C160,180 130,140 90,95"/>
    <path d="M225,215 C260,170 290,130 330,90"/>
    <path d="M235,235 C285,250 320,245 365,275"/>
    <path d="M215,270 C220,310 210,340 225,380"/>
    <path d="M185,270 C175,315 180,345 160,385"/>
  </g>
  <g fill="#8a7a55">
