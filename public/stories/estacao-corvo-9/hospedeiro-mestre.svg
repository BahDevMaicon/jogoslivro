  <rect x="140" y="288" width="14" height="8" fill="#241a10" stroke="#e8e2d5" stroke-width="1.5"/>
  <rect x="268" y="290" width="14" height="8" fill="#241a10" stroke="#e8e2d5" stroke-width="1.5"/>

  <!-- torso central, maior que humano -->
  <path d="M150,180 C140,220 145,260 165,300 L255,300 C273,260 278,220 262,180 C240,155 172,155 150,180 Z"
